name: AIVANTA Telegram Daily Report

on:
  schedule:
    - cron: "0 3,14 * * *" # 08:00 and 19:00 Tashkent (UTC+5)
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  send-report:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Build and send daily report
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          REPO: ${{ github.repository }}
        run: |
          python - <<'PY'
          import os, json, urllib.request, urllib.error, zipfile, io, re, xml.etree.ElementTree as ET
          from datetime import datetime, timezone, timedelta
          from email.utils import parsedate_to_datetime

          token=os.environ.get("TELEGRAM_BOT_TOKEN","")
          chat=os.environ.get("TELEGRAM_CHAT_ID","")
          if not token or not chat:
              raise SystemExit("Missing required GitHub Actions secrets: TELEGRAM_BOT_TOKEN and/or TELEGRAM_CHAT_ID. Add them in repository Settings > Secrets and variables > Actions.")

          repo=os.environ["REPO"]
          gh=os.environ.get("GH_TOKEN","")
          now=datetime.now(timezone.utc)
          def request(url, headers=None, timeout=20):
              req=urllib.request.Request(url, headers=headers or {})
              with urllib.request.urlopen(req, timeout=timeout) as r:
                  return r.status, r.read(), r.headers
          def gh_json(url):
              return request(url, {"Authorization":"Bearer "+gh,"Accept":"application/vnd.github+json","X-GitHub-Api-Version":"2022-11-28"})[1]
          # Latest newsroom workflow run and log diagnostics
          run_info="Newsroom run: unavailable"
          published="Publication: not confirmed in this report"
          rss_from_log=[]
          try:
              runs=json.loads(gh_json(f"https://api.github.com/repos/{repo}/actions/workflows/newsroom.yml/runs?per_page=1"))
              if runs.get("workflow_runs"):
                  run=runs["workflow_runs"][0]
                  run_info=f"Newsroom latest run #{run['run_number']}: {run['status']} / {run.get('conclusion') or 'in progress'}"
                  run_info+=f" (updated {run.get('updated_at','unknown')})"
                  if run.get("conclusion") in ("success","failure","cancelled"):
                      try:
                          _, logs, _=request(run["logs_url"], {"Authorization":"Bearer "+gh,"Accept":"application/vnd.github+json"})
                          z=zipfile.ZipFile(io.BytesIO(logs))
                          all_logs="\n".join(z.read(n).decode("utf-8","replace") for n in z.namelist() if n.endswith(".txt"))
                          for line in all_logs.splitlines():
                              if "feed diagnostics" in line or "feed skipped" in line or "Published:" in line or "No unseen news candidates" in line or "Gemini daily quota exhausted" in line or "Gemini model used:" in line:
                                  rss_from_log.append(line.strip()[:240])
                          for line in all_logs.splitlines():
                              if "Published:" in line:
                                  published="Supabase publishing log: "+line.strip()[:250]
                                  break
                      except Exception as e:
                          run_info+="; log fetch/parser unavailable"
          except Exception as e:
              run_info="Newsroom run: GitHub API check failed"

          # Live RSS source diagnostics
          feeds=[
            ("Reuters Tech","https://news.google.com/rss/search?q=when:7d+site:reuters.com/technology&ceid=US:en&hl=en-US&gl=US"),
            ("BBC Tech","https://feeds.bbci.co.uk/news/technology/rss.xml"),
            ("The Verge","https://www.theverge.com/rss/index.xml"),
            ("TechCrunch","https://techcrunch.com/feed/"),
            ("MIT News AI","https://news.mit.edu/rss/topic/artificial-intelligence2"),
            ("OpenAI","https://openai.com/blog/rss.xml")
          ]
          rss_lines=[]
          cutoff=now-timedelta(hours=24)
          def local(tag):
              return tag.rsplit("}",1)[-1].lower()
          def parse_dt(s):
              if not s: return None
              try:
                  d=parsedate_to_datetime(s)
                  if d.tzinfo is None: d=d.replace(tzinfo=timezone.utc)
                  return d.astimezone(timezone.utc)
              except: pass
              try:
                  d=datetime.fromisoformat(s.replace("Z","+00:00"))
                  if d.tzinfo is None: d=d.replace(tzinfo=timezone.utc)
                  return d.astimezone(timezone.utc)
              except: return None
          for name,url in feeds:
              try:
                  status,body,_=request(url,{"User-Agent":"AIVANTA-DailyReport/1.0"},timeout=15)
                  root=ET.fromstring(body)
                  items=[]
                  for el in root.iter():
                      if local(el.tag) in ("item","entry"):
                          title="";date=None
                          for child in list(el):
                              tag=local(child.tag)
                              if tag=="title" and not title: title=" ".join((child.text or "").split())
                              if tag in ("pubdate","published","updated","date"):
                                  date=parse_dt(child.text or "")
                          if title: items.append((title,date))
                  recent=[t for t,d in items if d and d>=cutoff]
                  rss_lines.append(f"{name}: HTTP {status} | {len(items)} items | {len(recent)} recent/24h")
                  for title in recent[:2]:
                      rss_lines.append("  • "+title[:180])
              except urllib.error.HTTPError as e:
                  rss_lines.append(f"{name}: HTTP {e.code} | fetch error")
              except Exception as e:
                  rss_lines.append(f"{name}: fetch error ({type(e).__name__})")
          tz=timezone(timedelta(hours=5))
          local_now=now.astimezone(tz).strftime("%Y-%m-%d %H:%M Tashkent")
          parts=[f"📰 AIVANTA Daily Report — {local_now}",run_info,published,"","RSS feeds (live, 24h):"]
          parts+=rss_lines
          if rss_from_log:
              parts+=["","Latest run log highlights:"]+rss_from_log[-10:]
          msg="\n".join(parts)
          if len(msg)>4000: msg=msg[:3900]+"\n…(truncated)"
          tg_url=f"https://api.telegram.org/bot{token}/sendMessage"
          payload=json.dumps({"chat_id":chat,"text":msg,"disable_web_page_preview":True}).encode()
          req=urllib.request.Request(tg_url,data=payload,headers={"Content-Type":"application/json"})
          with urllib.request.urlopen(req,timeout=20) as resp:
              result=json.loads(resp.read())
              if not result.get("ok"): raise SystemExit("Telegram API returned not-ok")
              print("Telegram daily report sent.")
          PY
