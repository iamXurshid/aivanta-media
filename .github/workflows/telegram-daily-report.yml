name: AIVANTA Telegram Daily Report

on:
  schedule:
    - cron: "0 3,14 * * *" # 08:00 and 19:00 Tashkent (UTC+5)
  workflow_dispatch:

permissions:
  contents: read

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Send simplified article report
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          AIVANTA_SITE_URL: ${{ secrets.AIVANTA_SITE_URL }}
          REPO: ${{ github.repository }}
        run: |
          python - <<'PY'
          import os,json,urllib.request,urllib.error
          from datetime import datetime,timezone,timedelta
          token=os.environ.get("TELEGRAM_BOT_TOKEN","")
          chat=os.environ.get("TELEGRAM_CHAT_ID","")
          db=os.environ.get("SUPABASE_URL","").rstrip("/")
          key=os.environ.get("SUPABASE_SERVICE_ROLE_KEY","")
          site=os.environ.get("AIVANTA_SITE_URL","").rstrip("/")
          if not all([token,chat,db,key,site]):
              raise SystemExit("Missing secrets: Telegram token/chat, Supabase URL/service key, or AIVANTA_SITE_URL")
          def get(url):
              req=urllib.request.Request(url,headers={"apikey":key,"Authorization":"Bearer "+key})
              with urllib.request.urlopen(req,timeout=20) as r:return json.loads(r.read())
          tz=timezone(timedelta(hours=5)); now=datetime.now(timezone.utc); cutoff=(now-timedelta(hours=24)).isoformat()
          base=db+"/rest/v1/articles"
          all_rows=get(base+"?select=slug,title,source_urls,published_at,views,status&status=eq.published&order=published_at.desc&limit=1000")
          recent=[a for a in all_rows if a.get("published_at") and a["published_at"]>=cutoff]
          total_views=sum(int(a.get("views") or 0) for a in all_rows)
          today_views=sum(int(a.get("views") or 0) for a in recent)
          total_articles=len(all_rows)
          def local_time(value):
              try:return datetime.fromisoformat(value.replace("Z","+00:00")).astimezone(tz).strftime("%H:%M")
              except:return "time unknown"
          lines=["📰 AIVANTA | "+now.astimezone(tz).strftime("%d %b %Y • %H:%M"),"","📄 ARTICLES (last 24h)"]
          if not recent: lines.append("No articles published in the last 24 hours.")
          for i,a in enumerate(recent[:10],1):
              src=(a.get("source_urls") or [])
              source=src[0] if src else "Source not listed"
              link=(site+"/article.html?slug="+a.get("slug","")) if site else (src[0] if src else "Article link unavailable (AIVANTA_SITE_URL not configured)")
              lines += [f"{i}. {a.get('title','Untitled')}",f"👁 Views: {int(a.get('views') or 0)} | 🕒 {local_time(a.get('published_at',''))}",f"🌐 Source: {source}",f"🔗 {link}",""]
          lines += ["📊 TOTAL","Published articles: "+str(total_articles),"Views total: "+str(total_views),"Views on last-24h articles: "+str(today_views),"Articles last 24h: "+str(len(recent))]
          msg="\n".join(lines)
          if len(msg)>3900:msg=msg[:3800]+"\n…"
          payload=json.dumps({"chat_id":chat,"text":msg,"disable_web_page_preview":True}).encode()
          req=urllib.request.Request("https://api.telegram.org/bot"+token+"/sendMessage",data=payload,headers={"Content-Type":"application/json"})
          try:
              with urllib.request.urlopen(req,timeout=20) as r:
                  result=json.loads(r.read())
                  if not result.get("ok"):raise SystemExit("Telegram sendMessage failed")
                  print("Simplified article report sent.")
          except urllib.error.HTTPError as e:
              print("Telegram API error:",e.code,e.read().decode("utf-8","replace"))
              raise
          PY
