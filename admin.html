<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AIVANTA Admin — Demo</title><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="admin.css"></head>
<body class="admin-body"><header class="top"><a class="logo" href="/">AI<span>VANTA</span></a><span class="admin-tag">ADMIN CONSOLE · DEMO</span><a class="subscribe" href="/">← Website</a></header>
<main class="admin-wrap"><div class="eyebrow">LOCAL TEST MODE</div><h1 class="admin-title">Editorial <em>studio.</em></h1>
<div class="admin-panel" style="border-color:#35c8ff"><strong>DEMO MODE</strong><p>Articles are saved only in this browser. This login is temporary and not production-secure.</p></div>
<div id="authbox" class="admin-panel"><h2>Admin sign in</h2><p>Demo credentials — Email: xurshid@aivanta.com · Password: demo2026</p><form id="login"><input id="email" type="email" placeholder="Email" required><input id="password" type="password" placeholder="Password" required><button type="submit">Sign in ↗</button></form><div id="authmsg" class="admin-msg"></div></div>
<div id="dash" hidden><div class="admin-toolbar"><div id="status" class="admin-msg"></div><button id="new" class="subscribe">+ New article</button><button id="logout" class="subscribe">Sign out</button></div><div class="admin-panel"><h2 id="editorTitle">Create article</h2><form id="editor"><input type="hidden" id="articleId"><input id="title" placeholder="Article title" required><input id="slug" placeholder="slug (auto-generated if blank)"><textarea id="excerpt" placeholder="Short excerpt" rows="3"></textarea><select id="category"><option>AI</option><option>Models</option><option>Agents</option><option>Tools</option><option>Robotics</option></select><textarea id="body" placeholder="Full article text" rows="12"></textarea><input id="sources" placeholder="Source URLs, separated by commas"><select id="state"><option value="draft">Save as Draft</option><option value="published">Publish (demo)</option></select><div class="admin-actions"><button type="submit">Save article</button><button type="button" id="cancel" class="subscribe">Clear</button></div></form><div id="editmsg" class="admin-msg"></div></div><h2 class="list-title">Articles</h2><div id="list" class="admin-list"></div></div></main><script src="admin.js"></script></body></html>
